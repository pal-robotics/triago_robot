    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint

    command_interfaces: velocity
    state_interfaces:
      - position
      - velocity
    gains:
     arm_left_1_joint:
      p: 0.36
      i: 36.0
      d: 0.001
     arm_left_2_joint:
      p: 0.36
      i: 36.0
      d: 0.001
