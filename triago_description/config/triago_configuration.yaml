arm_type_right:
  description: 'Arm type right'
  choices: ['tiago-pro', 'tiago-pro-s', 'no-arm']
  default_value: 'tiago-pro-s'
arm_type_left:
  description: 'Arm type left'
  choices: ['tiago-pro', 'tiago-pro-s', 'no-arm']
  default_value: 'tiago-pro-s'
arm_type_head:
  description: 'Arm type head'
  choices: ['tiago-pro', 'tiago-pro-s', 'no-arm']
  default_value: 'tiago-pro-s'
wrist_model_right:
  description: 'Wrist model right'
  choices: ['spherical-wrist']
  default_value: 'spherical-wrist'
wrist_model_left:
  description: 'Wrist model left'
  choices: ['spherical-wrist']
  default_value: 'spherical-wrist'
wrist_model_head:
  description: 'Wrist model head'
  choices: ['spherical-wrist']
  default_value: 'spherical-wrist'
laser_model:
  description: 'Base laser model'
  choices: ['no-laser', 'sick-571']
  default_value: 'sick-571'
end_effector_right:
  description: 'End effector model right arm'
  choices: ['pal-pro-gripper', 'custom', 'allegro-hand', 'no-end-effector'] 
  default_value: 'allegro-hand'
end_effector_left:
  description: 'End effector model left arm'
  choices: ['pal-pro-gripper', 'custom', 'allegro-hand', 'no-end-effector']
  default_value: 'allegro-hand'
end_effector_head:
  description: 'End effector model head arm'
  choices: ['pal-pro-gripper', 'custom', 'allegro-hand', 'no-end-effector']
  default_value: 'no-end-effector'
hand_head_type:
  description: 'If the head arm has allegro hand specify if it is right or left'
  choices: ['right' , 'left' , '']
  default_value: 'right'
ft_sensor_right:
  description: 'FT sensor model right arm'
  choices: ['ati', 'no-ft-sensor']
  default_value: 'ati'
ft_sensor_left:
  description: 'FT sensor model left arm'
  choices: ['ati', 'no-ft-sensor']
  default_value: 'ati'
ft_sensor_head:
  description: 'FT sensor model head arm'
  choices: ['ati', 'no-ft-sensor']
  default_value: 'no-ft-sensor'
base_type:
  description: 'Base type'
  choices: ['omni_base']
  default_value: 'omni_base'
camera_model:
  description: 'Arm camera model'
  choices: ['no-camera', 'realsense-d405']
  default_value: 'no-camera'
camera_right:
  description: 'Camera model right arm'
  choices: ['no-camera', 'realsense-d405', 'realsense-d435']
  default_value: 'no-camera'
camera_left:
  description: 'Camera model left arm'
  choices: ['no-camera', 'realsense-d405', 'realsense-d435']
  default_value: 'no-camera'
camera_head:
  description: 'Camera model head arm'
  choices: ['no-camera', 'realsense-d405', 'realsense-d435']
  default_value: 'realsense-d405'
wheel_model:
  description: 'Wheel model'
  choices: ['moog']
  default_value: 'moog'
torque_estimation:
  description: 'The arms have torque estimation'
  choices: ['False', 'True']
  default_value: 'False'
camera_position_head:
  description: 'Camera position Head'
  choices: ['up', 'down']
  default_value: 'down'
camera_position_right:
  description: 'Camera position Right'
  choices: ['up', 'down']
  default_value: 'down'
camera_position_left:
  description: 'Camera position Left'
  choices: ['up', 'down']
  default_value: 'down'
